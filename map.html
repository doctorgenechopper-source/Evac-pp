<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EOD Tools — 地図</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0e6a6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EOD Tools">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f1f3f2;--panel:#fff;--ink:#1b2326;--sub:#5a666b;--line:#d3d9d8;
  --acc:#0e6a6a;--acc-ink:#fff;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121719;--panel:#1b2225;--ink:#e6ecea;--sub:#9aa7aa;--line:#2e393c;
  --acc:#4fc1b9;--acc-ink:#06201f;color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  color:var(--ink);font-size:15px}
#map{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;
  bottom:calc(52px + env(safe-area-inset-bottom,0px))}

/* ── ボタン共通 ── */
.ctrl-btn{
  display:block;padding:7px 11px;border-radius:8px;font:inherit;font-size:.8rem;
  border:1px solid rgba(0,0,0,.2);background:var(--panel);color:var(--ink);
  cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.13);white-space:nowrap;
  text-align:center;
}
.ctrl-btn:disabled{opacity:.45;cursor:default}
.ctrl-btn:active{opacity:.7}

/* ── 左上（エリア設定・現在地・クリア） ── */
#ctrl-left{
  position:fixed;top:calc(env(safe-area-inset-top,0px)+10px);
  left:10px;z-index:400;display:flex;flex-direction:column;gap:6px;
}
/* ── 右上（航空写真・表示設定・情報ウィンドウ） ── */
#ctrl-right{
  position:fixed;top:calc(env(safe-area-inset-top,0px)+10px);
  right:10px;z-index:400;display:flex;flex-direction:column;gap:6px;
}
/* ── 左下（保存・履歴） ── */
#ctrl-bottom{
  position:fixed;
  bottom:calc(56px + env(safe-area-inset-bottom,0px) + 10px);
  left:10px;z-index:400;display:flex;gap:8px;
}

/* ── 凡例パネル（右上、情報ウィンドウ） ── */
#legend{
  background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;
  box-shadow:0 2px 6px rgba(0,0,0,.13);
  max-width:185px;min-width:120px;
  transition:opacity .15s;
}
#legend.hidden{display:none}
#legend-body{max-height:40vh;overflow-y:auto}
.lgd-row{display:flex;align-items:center;gap:6px;padding:3px 0;white-space:nowrap}
.lgd-sw{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:2px solid}
.lgd-nm{font-size:.72rem;flex:1;overflow:hidden;text-overflow:ellipsis}
.lgd-dist{font-size:.7rem;color:var(--sub);font-variant-numeric:tabular-nums;flex-shrink:0}
.lgd-empty{font-size:.72rem;color:var(--sub);padding:2px 0}

/* ── 座標バー ── */
#coords-bar{
  position:fixed;bottom:calc(56px + env(safe-area-inset-bottom,0px));
  left:0;right:0;display:flex;justify-content:center;z-index:400;pointer-events:none;
}
#coords-text{
  background:var(--panel);border:1px solid var(--line);
  padding:3px 12px;border-radius:16px;font-size:.73rem;color:var(--sub);
  box-shadow:0 1px 4px rgba(0,0,0,.1);font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* ── ズームコントロール ── */
.leaflet-bottom.leaflet-right{bottom:calc(58px + env(safe-area-inset-bottom,0px))}

/* ── モーダル共通 ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:600;display:none;align-items:flex-end}
.modal-ov.open{display:flex}
.modal-sheet{background:var(--panel);border-radius:16px 16px 0 0;width:100%;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-hd span{font-weight:600;font-size:.95rem}
.modal-hd button{padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}

/* ── 表示設定 ── */
#settings-body{overflow-y:auto;max-height:70vh}
.sec-hd{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0 6px;border-bottom:2px solid var(--line);margin-bottom:4px}
.sec-master{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;cursor:pointer}
.sec-master input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc);flex-shrink:0}
.sec-actions{display:flex;gap:5px}
.sec-actions button{padding:4px 9px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:inherit;font-size:.78rem;cursor:pointer}
.cb-row{display:flex;align-items:center;gap:8px;padding:7px 2px;cursor:pointer;
  font-size:.85rem;user-select:none}
.cb-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);flex-shrink:0}
.swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid transparent}
.swatch-dash{background:transparent!important;border-style:dashed}
.preset-row{display:flex;align-items:center;gap:7px;padding:7px 2px}
.preset-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);flex-shrink:0}
.preset-lbl{flex:1;font-size:.85rem}
.pdist{width:70px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem;
  text-align:right;font-variant-numeric:tabular-nums}
.pdist:disabled{opacity:.4}
.pdist:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.unit{font-size:.75rem;color:var(--sub);flex-shrink:0}
.surface-opts{padding:2px 32px 6px;display:flex;flex-direction:column;gap:6px}
.radio-row{display:flex;align-items:center;gap:7px;font-size:.83rem;cursor:pointer;user-select:none}
.radio-row input[type=radio]{width:15px;height:15px;accent-color:var(--acc);flex-shrink:0}
.calc-badge{font-size:.72rem;color:var(--acc);background:var(--bg);
  padding:1px 7px;border-radius:10px;border:1px solid var(--line)}
.no-calc-note{font-size:.75rem;color:var(--sub);padding:4px 2px;font-style:italic}

/* ── 保存・履歴リスト ── */
.list-scroll{max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-info{flex:1;min-width:0;cursor:pointer}
.list-info:active{opacity:.7}
.list-name{font-weight:600;font-size:.9rem}
.list-sub{font-size:.72rem;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-del{padding:5px 9px;border-radius:6px;border:1px solid rgba(179,38,30,.35);
  background:transparent;color:#b3261e;font:inherit;font-size:.78rem;cursor:pointer;flex-shrink:0}
.empty-msg{color:var(--sub);font-size:.88rem;padding:14px 0;text-align:center}

/* 入力 */
.txt-inp{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}
.txt-inp:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn-primary{background:var(--acc);color:var(--acc-ink);border:none;border-radius:8px;
  padding:10px 14px;font:inherit;cursor:pointer;width:100%}
.feedback{font-size:.82rem;color:var(--acc);min-height:1.2em;margin-top:4px}

/* エリア設定 */
#area-sel{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}

/* ── ボトムナビ ── */
.bnav{position:fixed;bottom:0;left:0;right:0;
  will-change:transform;transform:translateZ(0);
  background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:500;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:7px 2px 5px;text-decoration:none;color:var(--sub);font-size:.62rem;gap:2px}
.bnav-item.active{color:var(--acc)}
.bnav-icon{font-size:1.2rem;line-height:1}
.leaflet-marker-draggable{cursor:grab}
.leaflet-marker-draggable:active{cursor:grabbing}
</style>
</head>
<body>

<div id="map"></div>

<!-- 左上: エリア設定・現在地・クリア -->
<div id="ctrl-left">
  <button class="ctrl-btn" id="area-btn">⚙ エリア設定</button>
  <button class="ctrl-btn" id="gps-btn">📍 現在地</button>
  <button class="ctrl-btn" id="clear-btn" hidden>🗑 クリア</button>
</div>

<!-- 右上: 航空写真・表示設定・情報ウィンドウ -->
<div id="ctrl-right">
  <button class="ctrl-btn" id="layer-btn">📷 航空写真</button>
  <button class="ctrl-btn" id="display-btn">🎯 表示設定</button>
  <div id="legend">
    <button class="ctrl-btn" id="info-btn" style="margin-bottom:6px;width:100%;box-shadow:none;border-color:var(--line)">ℹ 情報ウィンドウ</button>
    <div id="legend-body"></div>
  </div>
</div>

<!-- 左下: 保存・履歴 -->
<div id="ctrl-bottom">
  <button class="ctrl-btn" id="scene-save-btn">💾 保存</button>
  <button class="ctrl-btn" id="scene-hist-btn">📋 履歴</button>
</div>

<!-- 座標バー -->
<div id="coords-bar"><span id="coords-text">地図をタップして爆発点を設定</span></div>

<!-- 表示設定モーダル -->
<div class="modal-ov" id="settings-ov">
  <div class="modal-sheet">
    <div class="modal-hd"><span>🎯 表示設定</span><button id="settings-close">✕ 閉じる</button></div>
    <div id="settings-body">
      <div class="sec-hd">
        <label class="sec-master"><input type="checkbox" id="cb-calc-sec" checked><span>計算値</span></label>
      </div>
      <div id="calc-no-data" class="no-calc-note" hidden>※ 計算ページで計算を実行すると反映されます</div>
      <label class="cb-row"><input type="checkbox" id="cb-k16" checked>
        <span class="swatch" style="background:#22c55e30;border-color:#22c55e"></span>Essential personnel (K=16)</label>
      <label class="cb-row"><input type="checkbox" id="cb-k61" checked>
        <span class="swatch" style="background:#f59e0b30;border-color:#f59e0b"></span>Structural damage (K=61)</label>
      <label class="cb-row"><input type="checkbox" id="cb-k100" checked>
        <span class="swatch" style="background:#ef444430;border-color:#ef4444"></span>Non-essential personnel (K=100)</label>
      <label class="cb-row"><input type="checkbox" id="cb-hfdr">
        <span class="swatch swatch-dash" style="border-color:#3b82f6"></span>HFDR（危険破片距離）</label>
      <label class="cb-row"><input type="checkbox" id="cb-mfdr">
        <span class="swatch swatch-dash" style="border-color:#8b5cf6"></span>MFDR（最大破片距離）</label>

      <div class="sec-hd" style="margin-top:14px">
        <label class="sec-master"><input type="checkbox" id="cb-preset-sec" checked><span>規定値</span></label>
        <div class="sec-actions">
          <button id="preset-save-open">💾 保存</button>
          <button id="preset-load-open">📋 読込</button>
        </div>
      </div>
      <div class="preset-row">
        <input type="checkbox" id="cb-solid" checked>
        <span class="swatch" style="background:#0ea5e930;border-color:#0ea5e9"></span>
        <span class="preset-lbl">強固な処分壕</span>
        <input type="number" class="pdist" id="dist-solid" min="0" placeholder="距離">
        <span class="unit">m</span>
      </div>
      <div class="preset-row">
        <input type="checkbox" id="cb-simple" checked>
        <span class="swatch" style="background:#10b98130;border-color:#10b981"></span>
        <span class="preset-lbl">簡易な処分壕</span>
        <input type="number" class="pdist" id="dist-simple" min="0" placeholder="距離">
        <span class="unit">m</span>
      </div>
      <div class="preset-row">
        <input type="checkbox" id="cb-chamber" checked>
        <span class="swatch" style="background:#f9731630;border-color:#f97316"></span>
        <span class="preset-lbl">チャンバー</span>
        <input type="number" class="pdist" id="dist-chamber" min="0" placeholder="距離">
        <span class="unit">m</span>
      </div>
      <div class="preset-row">
        <input type="checkbox" id="cb-surface" checked>
        <span class="swatch swatch-dash" style="border-color:#dc2626"></span>
        <span class="preset-lbl">地表爆破</span>
      </div>
      <div class="surface-opts">
        <label class="radio-row">
          <input type="radio" name="surf-mode" id="surf-calc" value="calc" checked>
          K=100計算値を使用 <span class="calc-badge" id="surf-calc-badge"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="surf-mode" id="surf-manual" value="manual">
          直接入力
          <input type="number" class="pdist" id="dist-surface" min="0" placeholder="距離" disabled>
          <span class="unit">m</span>
        </label>
      </div>
    </div>
  </div>
</div>

<!-- 規定値プリセット保存 -->
<div class="modal-ov" id="preset-save-ov">
  <div class="modal-sheet">
    <div class="modal-hd"><span>💾 規定値を保存</span><button id="preset-save-close">✕ 閉じる</button></div>
    <input class="txt-inp" id="preset-save-inp" type="text" placeholder="プリセット名（例: ○○現場）" maxlength="30">
    <button class="btn-primary" id="preset-save-confirm">保存</button>
    <p class="feedback" id="preset-save-fb"></p>
  </div>
</div>

<!-- 規定値プリセット読込 -->
<div class="modal-ov" id="preset-load-ov">
  <div class="modal-sheet">
    <div class="modal-hd"><span>📋 規定値を読込</span><button id="preset-load-close">✕ 閉じる</button></div>
    <div class="list-scroll" id="preset-list"></div>
  </div>
</div>

<!-- シーン保存（マーカー+縮尺+設定） -->
<div class="modal-ov" id="scene-save-ov">
  <div class="modal-sheet">
    <div class="modal-hd"><span>💾 現在の状態を保存</span><button id="scene-save-close">✕ 閉じる</button></div>
    <p style="font-size:.82rem;color:var(--sub);margin:0 0 10px">爆発点・縮尺・表示中の全円・マップ種別を保存します。</p>
    <input class="txt-inp" id="scene-name-inp" type="text" placeholder="名前を入力（例: ○○現場 2024/11/15）" maxlength="30">
    <button class="btn-primary" id="scene-save-confirm">保存する</button>
    <p class="feedback" id="scene-save-fb"></p>
  </div>
</div>

<!-- シーン履歴 -->
<div class="modal-ov" id="scene-hist-ov">
  <div class="modal-sheet">
    <div class="modal-hd"><span>📋 保存履歴</span><button id="scene-hist-close">✕ 閉じる</button></div>
    <div class="list-scroll" id="scene-list"></div>
  </div>
</div>

<!-- エリア設定 -->
<div class="modal-ov" id="area-ov">
  <div class="modal-sheet">
    <div class="modal-hd"><span>⚙ 初期表示エリア</span><button id="area-close">✕ 閉じる</button></div>
    <label style="font-size:.85rem;color:var(--sub);display:block;margin-bottom:6px">都道府県を選択</label>
    <select id="area-sel"></select>
    <button class="btn-primary" id="area-save">保存</button>
    <p class="feedback" id="area-fb"></p>
  </div>
</div>

<nav class="bnav">
  <a class="bnav-item" href="./index.html"><span class="bnav-icon">🚨</span><span>計算</span></a>
  <a class="bnav-item" href="./sandbag.html"><span class="bnav-icon">🪏</span><span>土嚢</span></a>
  <a class="bnav-item" href="./convert.html"><span class="bnav-icon">🔄</span><span>変換</span></a>
  <a class="bnav-item active" href="./map.html" aria-current="page"><span class="bnav-icon">🗺</span><span>地図</span></a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ls  = key => { try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; }};
const lsS = (key,val) => { try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){}};

// ── 都道府県 ──────────────────────────────────
const PREFS=[
  {n:'北海道',lat:43.0642,lng:141.3469},{n:'青森',lat:40.8244,lng:140.7400},
  {n:'岩手',lat:39.7036,lng:141.1527},{n:'宮城',lat:38.2688,lng:140.8721},
  {n:'秋田',lat:39.7186,lng:140.1023},{n:'山形',lat:38.2404,lng:140.3634},
  {n:'福島',lat:37.7503,lng:140.4676},{n:'茨城',lat:36.3418,lng:140.4468},
  {n:'栃木',lat:36.5658,lng:139.8836},{n:'群馬',lat:36.3912,lng:139.0608},
  {n:'埼玉',lat:35.8569,lng:139.6489},{n:'千葉',lat:35.6047,lng:140.1233},
  {n:'東京',lat:35.6762,lng:139.6503},{n:'神奈川',lat:35.4478,lng:139.6425},
  {n:'新潟',lat:37.9026,lng:139.0232},{n:'富山',lat:36.6953,lng:137.2113},
  {n:'石川',lat:36.5947,lng:136.6256},{n:'福井',lat:36.0652,lng:136.2219},
  {n:'山梨',lat:35.6635,lng:138.5684},{n:'長野',lat:36.6513,lng:138.1811},
  {n:'岐阜',lat:35.3912,lng:136.7223},{n:'静岡',lat:34.9769,lng:138.3831},
  {n:'愛知',lat:35.1802,lng:136.9066},{n:'三重',lat:34.7303,lng:136.5086},
  {n:'滋賀',lat:35.0045,lng:135.8686},{n:'京都',lat:35.0116,lng:135.7681},
  {n:'大阪',lat:34.6937,lng:135.5023},{n:'兵庫',lat:34.6913,lng:135.1830},
  {n:'奈良',lat:34.6851,lng:135.8325},{n:'和歌山',lat:34.2260,lng:135.1675},
  {n:'鳥取',lat:35.5011,lng:134.2351},{n:'島根',lat:35.4723,lng:133.0505},
  {n:'岡山',lat:34.6618,lng:133.9344},{n:'広島',lat:34.3966,lng:132.4596},
  {n:'山口',lat:34.1860,lng:131.4705},{n:'徳島',lat:34.0658,lng:134.5593},
  {n:'香川',lat:34.3401,lng:134.0434},{n:'愛媛',lat:33.8417,lng:132.7657},
  {n:'高知',lat:33.5597,lng:133.5311},{n:'福岡',lat:33.6064,lng:130.4181},
  {n:'佐賀',lat:33.2494,lng:130.2988},{n:'長崎',lat:32.7448,lng:129.8737},
  {n:'熊本',lat:32.7898,lng:130.7417},{n:'大分',lat:33.2382,lng:131.6126},
  {n:'宮崎',lat:31.9110,lng:131.4237},{n:'鹿児島',lat:31.5602,lng:130.5581},
  {n:'沖縄',lat:26.2124,lng:127.6809},
];
PREFS.forEach((p,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=p.n; $('area-sel').appendChild(o); });

// ── LocalStorage キー ─────────────────────────
const KEY_HOME     = 'eod-map-home';
const KEY_CALC_CFG = 'eod-calc-cfg';
const KEY_PRST_CFG = 'eod-preset-cfg';
const KEY_PRST_SAV = 'eod-preset-saves';
const KEY_SCENE    = 'eod-scene-saves';

// ── 初期エリア ────────────────────────────────
let home={lat:35.6762,lng:139.6503};
const h=ls(KEY_HOME); if(h){ home=h; const idx=PREFS.findIndex(p=>p.n===h.name); if(idx>=0) $('area-sel').value=idx; }

// ── 計算値設定復元 ────────────────────────────
const calcCfg=ls(KEY_CALC_CFG)||{sec:true,k16:true,k61:true,k100:true,hfdr:false,mfdr:false};
$('cb-calc-sec').checked=calcCfg.sec; $('cb-k16').checked=calcCfg.k16;
$('cb-k61').checked=calcCfg.k61; $('cb-k100').checked=calcCfg.k100;
$('cb-hfdr').checked=calcCfg.hfdr; $('cb-mfdr').checked=calcCfg.mfdr;

// ── 規定値設定復元 ────────────────────────────
const prCfg=ls(KEY_PRST_CFG)||{sec:true,
  solid:{en:true,dist:''},simple:{en:true,dist:''},chamber:{en:true,dist:''},
  surface:{en:true,mode:'calc',dist:''}};
$('cb-preset-sec').checked=prCfg.sec;
$('cb-solid').checked=prCfg.solid.en;    $('dist-solid').value=prCfg.solid.dist||'';
$('cb-simple').checked=prCfg.simple.en;  $('dist-simple').value=prCfg.simple.dist||'';
$('cb-chamber').checked=prCfg.chamber.en;$('dist-chamber').value=prCfg.chamber.dist||'';
$('cb-surface').checked=prCfg.surface.en;
if(prCfg.surface.mode==='manual'){ $('surf-manual').checked=true; $('dist-surface').disabled=false; }
$('dist-surface').value=prCfg.surface.dist||'';

// ── 地図初期化 ───────────────────────────────
const map=L.map('map',{zoomControl:false}).setView([home.lat,home.lng],12);
L.control.zoom({position:'bottomright'}).addTo(map);
const layerOSM=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19});
const layerGSI=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{
  attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',maxZoom:18});
let curLayer='osm'; layerOSM.addTo(map);

$('layer-btn').addEventListener('click',()=>{
  if(curLayer==='osm'){ map.removeLayer(layerOSM); layerGSI.addTo(map); curLayer='gsi'; $('layer-btn').textContent='🗺 地図に戻す'; }
  else{ map.removeLayer(layerGSI); layerOSM.addTo(map); curLayer='osm'; $('layer-btn').textContent='📷 航空写真'; }
});

// ── 情報ウィンドウ（凡例）折りたたみ ───────────
let legendVisible=true;
$('info-btn').addEventListener('click',()=>{
  legendVisible=!legendVisible;
  $('legend-body').style.display=legendVisible?'':'none';
  $('info-btn').textContent=legendVisible?'ℹ 情報ウィンドウ ▴':'ℹ 情報ウィンドウ ▾';
});

// ── 状態保存 ─────────────────────────────────
function saveCalcCfg(){
  lsS(KEY_CALC_CFG,{sec:$('cb-calc-sec').checked,k16:$('cb-k16').checked,
    k61:$('cb-k61').checked,k100:$('cb-k100').checked,
    hfdr:$('cb-hfdr').checked,mfdr:$('cb-mfdr').checked});
}
function getCurrentPresetCfg(){
  return {sec:$('cb-preset-sec').checked,
    solid:{en:$('cb-solid').checked,dist:$('dist-solid').value},
    simple:{en:$('cb-simple').checked,dist:$('dist-simple').value},
    chamber:{en:$('cb-chamber').checked,dist:$('dist-chamber').value},
    surface:{en:$('cb-surface').checked,mode:$('surf-manual').checked?'manual':'calc',dist:$('dist-surface').value}};
}
function savePrCfg(){ lsS(KEY_PRST_CFG,getCurrentPresetCfg()); }
function applyPresetCfg(cfg){
  $('cb-preset-sec').checked=cfg.sec;
  $('cb-solid').checked=cfg.solid.en;    $('dist-solid').value=cfg.solid.dist||'';
  $('cb-simple').checked=cfg.simple.en;  $('dist-simple').value=cfg.simple.dist||'';
  $('cb-chamber').checked=cfg.chamber.en;$('dist-chamber').value=cfg.chamber.dist||'';
  $('cb-surface').checked=cfg.surface.en;
  if(cfg.surface.mode==='manual'){ $('surf-manual').checked=true; $('dist-surface').disabled=false; }
  else{ $('surf-calc').checked=true; $('dist-surface').disabled=true; }
  $('dist-surface').value=cfg.surface.dist||'';
}

// ── 円定義 ───────────────────────────────────
const CALC_DEF=[
  {id:'k16', label:'Essential (K=16)',    color:'#22c55e',fill:.12},
  {id:'k61', label:'Structural (K=61)',   color:'#f59e0b',fill:.12},
  {id:'k100',label:'Non-essential (K=100)',color:'#ef4444',fill:.12},
  {id:'hfdr',label:'HFDR',               color:'#3b82f6',fill:.08,dash:'6 4'},
  {id:'mfdr',label:'MFDR',               color:'#8b5cf6',fill:.06,dash:'8 5'},
];
const PRESET_DEF=[
  {id:'solid',  label:'強固な処分壕', color:'#0ea5e9',fill:.12},
  {id:'simple', label:'簡易な処分壕', color:'#10b981',fill:.12},
  {id:'chamber',label:'チャンバー',   color:'#f97316',fill:.12},
];

function updateSurfaceBadge(){
  const d=ls('eod-map-data');
  $('surf-calc-badge').textContent=d?.circles?.[2]?.dist ? d.circles[2].dist.toLocaleString('ja-JP')+'m' : '（計算値なし）';
  $('calc-no-data').hidden=!!d;
}
updateSurfaceBadge();

function getAllCircles(){
  const result=[]; const d=ls('eod-map-data');
  if($('cb-calc-sec').checked && d?.circles){
    CALC_DEF.forEach((def,i)=>{
      if($('cb-'+def.id).checked && d.circles[i]?.dist>0)
        result.push({label:d.circles[i].label||def.label,dist:d.circles[i].dist,
          color:def.color,fill:def.fill,dash:def.dash||null});
    });
  }
  if($('cb-preset-sec').checked){
    PRESET_DEF.forEach(def=>{
      const dist=parseFloat($('dist-'+def.id).value);
      if($('cb-'+def.id).checked && dist>0)
        result.push({label:def.label,dist,color:def.color,fill:def.fill});
    });
    if($('cb-surface').checked){
      let dist=$('surf-manual').checked ? parseFloat($('dist-surface').value)||0
        : ls('eod-map-data')?.circles?.[2]?.dist||0;
      if(dist>0) result.push({label:'地表爆破',dist,color:'#dc2626',fill:.10,dash:'4 3'});
    }
  }
  return result;
}

// ── 凡例更新 ─────────────────────────────────
function updateLegend(){
  const body=$('legend-body'); body.replaceChildren();
  const all=getAllCircles();
  if(!all.length){ const d=document.createElement('div'); d.className='lgd-empty'; d.textContent='表示設定で円を有効に'; body.appendChild(d); return; }
  all.forEach(item=>{
    const row=document.createElement('div'); row.className='lgd-row';
    const sw=document.createElement('span'); sw.className='lgd-sw';
    sw.style.cssText=`background:${item.color}30;border-color:${item.color}${item.dash?';border-style:dashed':''}`;
    const nm=document.createElement('span'); nm.className='lgd-nm'; nm.textContent=item.label;
    const dist=document.createElement('span'); dist.className='lgd-dist'; dist.textContent=item.dist.toLocaleString('ja-JP')+'m';
    row.append(sw,nm,dist); body.appendChild(row);
  });
}
updateLegend();

// ── マーカー・円 ─────────────────────────────
let marker=null, circles=[];
const bombIcon=L.divIcon({
  html:'<div style="font-size:28px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))">💥</div>',
  iconSize:[32,32],iconAnchor:[16,16],className:''
});

function drawCircles(ll){
  circles.forEach(c=>map.removeLayer(c)); circles=[];
  const all=getAllCircles();
  all.sort((a,b)=>b.dist-a.dist);
  let maxR=0;
  all.forEach(item=>{
    const c=L.circle(ll,{radius:item.dist,color:item.color,fillColor:item.color,
      fillOpacity:item.fill,weight:2,dashArray:item.dash||undefined}).addTo(map);
    c.bindTooltip(item.label+': '+item.dist.toLocaleString('ja-JP')+'m');
    circles.push(c);
    if(item.dist>maxR) maxR=item.dist;
  });
  if(maxR>0) map.fitBounds(L.circle(ll,{radius:maxR}).getBounds().pad(.1));
}

function setPoint(ll, skipFit){
  if(marker) map.removeLayer(marker);
  marker=L.marker(ll,{icon:bombIcon,draggable:true,zIndexOffset:1000}).addTo(map);
  marker.on('drag',e=>{ circles.forEach(c=>c.setLatLng(e.latlng)); updateCoords(e.latlng); });
  marker.on('dragend',e=>updateCoords(e.target.getLatLng()));
  updateCoords(ll);
  if(!skipFit){ drawCircles(ll); }
  else { circles.forEach(c=>map.removeLayer(c)); circles=[]; const all=getAllCircles(); all.sort((a,b)=>b.dist-a.dist); all.forEach(item=>{ const c=L.circle(ll,{radius:item.dist,color:item.color,fillColor:item.color,fillOpacity:item.fill,weight:2,dashArray:item.dash||undefined}).addTo(map); c.bindTooltip(item.label+': '+item.dist.toLocaleString('ja-JP')+'m'); circles.push(c); }); }
  updateLegend();
  $('clear-btn').hidden=false;
}

function updateCoords(ll){ $('coords-text').textContent='📍 '+ll.lat.toFixed(5)+', '+ll.lng.toFixed(5); }

map.on('click',e=>setPoint(e.latlng));

// ── GPS ─────────────────────────────────────
$('gps-btn').addEventListener('click',()=>{
  if(!navigator.geolocation){ alert('GPSに対応していません'); return; }
  const btn=$('gps-btn'); btn.textContent='📍 取得中…'; btn.disabled=true;
  navigator.geolocation.getCurrentPosition(
    pos=>{ const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);
      map.setView(ll,15); setPoint(ll); btn.textContent='📍 現在地'; btn.disabled=false; },
    ()=>{ btn.textContent='📍 現在地'; btn.disabled=false;
      alert('位置情報の取得に失敗しました。\nブラウザで位置情報を許可してください。'); },
    {enableHighAccuracy:true,timeout:10000}
  );
});

// ── クリア ───────────────────────────────────
$('clear-btn').addEventListener('click',()=>{
  if(marker){ map.removeLayer(marker); marker=null; }
  circles.forEach(c=>map.removeLayer(c)); circles=[];
  $('clear-btn').hidden=true;
  $('coords-text').textContent='地図をタップして爆発点を設定';
  updateLegend();
});

// ── 表示設定モーダル ─────────────────────────
$('display-btn').addEventListener('click',()=>{ updateSurfaceBadge(); $('settings-ov').classList.add('open'); });
$('settings-close').addEventListener('click',()=>$('settings-ov').classList.remove('open'));
$('settings-ov').addEventListener('click',e=>{ if(e.target===$('settings-ov')) $('settings-ov').classList.remove('open'); });

function onSettingChange(){ saveCalcCfg(); savePrCfg(); updateLegend(); if(marker) setPoint(marker.getLatLng(),true); }
['cb-calc-sec','cb-k16','cb-k61','cb-k100','cb-hfdr','cb-mfdr',
 'cb-preset-sec','cb-solid','cb-simple','cb-chamber','cb-surface'].forEach(id=>$(id).addEventListener('change',onSettingChange));
['dist-solid','dist-simple','dist-chamber','dist-surface'].forEach(id=>$(id).addEventListener('input',onSettingChange));
document.querySelectorAll('[name=surf-mode]').forEach(r=>r.addEventListener('change',()=>{
  $('dist-surface').disabled=$('surf-calc').checked; onSettingChange();
}));

// ── 規定値プリセット ─────────────────────────
function getPresetSummary(){
  const p=[]; PRESET_DEF.forEach(def=>{ const d=parseFloat($('dist-'+def.id).value); if($('cb-'+def.id).checked&&d>0) p.push(def.label+' '+d+'m'); });
  if($('cb-surface').checked){ const d=$('surf-manual').checked?parseFloat($('dist-surface').value)||0:ls('eod-map-data')?.circles?.[2]?.dist||0; if(d>0) p.push('地表爆破 '+d+'m'); }
  return p.join(' / ')||'（距離未入力）';
}
function getPresets(){ return ls(KEY_PRST_SAV)||[]; }
function savePresets(arr){ lsS(KEY_PRST_SAV,arr); }

$('preset-save-open').addEventListener('click',()=>{ $('preset-save-inp').value=''; $('preset-save-fb').textContent=''; $('preset-save-ov').classList.add('open'); setTimeout(()=>$('preset-save-inp').focus(),150); });
$('preset-save-close').addEventListener('click',()=>$('preset-save-ov').classList.remove('open'));
$('preset-save-ov').addEventListener('click',e=>{ if(e.target===$('preset-save-ov')) $('preset-save-ov').classList.remove('open'); });
$('preset-save-confirm').addEventListener('click',()=>{
  const name=$('preset-save-inp').value.trim(); if(!name){ $('preset-save-inp').focus(); return; }
  const arr=getPresets(); arr.unshift({id:Date.now(),name,summary:getPresetSummary(),data:getCurrentPresetCfg()});
  if(arr.length>30) arr.splice(30); savePresets(arr);
  $('preset-save-fb').textContent='✓ 「'+name+'」を保存しました';
  setTimeout(()=>$('preset-save-ov').classList.remove('open'),1200);
});
$('preset-save-inp').addEventListener('keydown',e=>{ if(e.key==='Enter') $('preset-save-confirm').click(); });

function renderPresetList(){
  const list=$('preset-list'); list.replaceChildren();
  const arr=getPresets();
  if(!arr.length){ const d=document.createElement('div'); d.className='empty-msg'; d.textContent='保存された規定値がありません'; list.appendChild(d); return; }
  arr.forEach(p=>{
    const item=document.createElement('div'); item.className='list-item';
    const info=document.createElement('div'); info.className='list-info';
    const nm=document.createElement('div'); nm.className='list-name'; nm.textContent=p.name;
    const sub=document.createElement('div'); sub.className='list-sub'; sub.textContent=p.summary;
    info.append(nm,sub); info.addEventListener('click',()=>{ applyPresetCfg(p.data); onSettingChange(); $('preset-load-ov').classList.remove('open'); });
    const del=document.createElement('button'); del.className='list-del'; del.textContent='削除';
    del.addEventListener('click',ev=>{ ev.stopPropagation(); savePresets(getPresets().filter(x=>x.id!==p.id)); renderPresetList(); });
    item.append(info,del); list.appendChild(item);
  });
}
$('preset-load-open').addEventListener('click',()=>{ renderPresetList(); $('preset-load-ov').classList.add('open'); });
$('preset-load-close').addEventListener('click',()=>$('preset-load-ov').classList.remove('open'));
$('preset-load-ov').addEventListener('click',e=>{ if(e.target===$('preset-load-ov')) $('preset-load-ov').classList.remove('open'); });

// ── シーン保存・復元 ─────────────────────────
function getScenes(){ return ls(KEY_SCENE)||[]; }
function saveScenes(arr){ lsS(KEY_SCENE,arr); }

function getSceneSummary(){
  const all=getAllCircles();
  return all.slice(0,3).map(c=>c.label.replace(/ \(.*\)/,'').replace(/（.*）/,'')+' '+c.dist.toLocaleString('ja-JP')+'m').join(' / ') || '（円なし）';
}

$('scene-save-btn').addEventListener('click',()=>{
  if(!marker){ alert('まず地図上の爆発点を設定してください。'); return; }
  $('scene-name-inp').value=''; $('scene-save-fb').textContent='';
  $('scene-save-ov').classList.add('open');
  setTimeout(()=>$('scene-name-inp').focus(),150);
});
$('scene-save-close').addEventListener('click',()=>$('scene-save-ov').classList.remove('open'));
$('scene-save-ov').addEventListener('click',e=>{ if(e.target===$('scene-save-ov')) $('scene-save-ov').classList.remove('open'); });
$('scene-save-confirm').addEventListener('click',()=>{
  const name=$('scene-name-inp').value.trim(); if(!name){ $('scene-name-inp').focus(); return; }
  const ll=marker.getLatLng();
  const now=new Date();
  const date=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const arr=getScenes();
  arr.unshift({
    id:Date.now(), name, date, summary:getSceneSummary(),
    markerLat:ll.lat, markerLng:ll.lng,
    mapLat:map.getCenter().lat, mapLng:map.getCenter().lng,
    zoom:map.getZoom(), layer:curLayer,
    calcCfg:{sec:$('cb-calc-sec').checked,k16:$('cb-k16').checked,k61:$('cb-k61').checked,k100:$('cb-k100').checked,hfdr:$('cb-hfdr').checked,mfdr:$('cb-mfdr').checked},
    presetCfg:getCurrentPresetCfg()
  });
  if(arr.length>30) arr.splice(30); saveScenes(arr);
  $('scene-save-fb').textContent='✓ 「'+name+'」を保存しました';
  setTimeout(()=>$('scene-save-ov').classList.remove('open'),1200);
});
$('scene-name-inp').addEventListener('keydown',e=>{ if(e.key==='Enter') $('scene-save-confirm').click(); });

function renderSceneList(){
  const list=$('scene-list'); list.replaceChildren();
  const arr=getScenes();
  if(!arr.length){ const d=document.createElement('div'); d.className='empty-msg'; d.textContent='保存された履歴がありません'; list.appendChild(d); return; }
  arr.forEach(sc=>{
    const item=document.createElement('div'); item.className='list-item';
    const info=document.createElement('div'); info.className='list-info';
    const nm=document.createElement('div'); nm.className='list-name'; nm.textContent=sc.name;
    const sub=document.createElement('div'); sub.className='list-sub'; sub.textContent=sc.date+' — '+sc.summary;
    info.append(nm,sub);
    info.addEventListener('click',()=>{
      // 設定を復元
      $('cb-calc-sec').checked=sc.calcCfg.sec; $('cb-k16').checked=sc.calcCfg.k16;
      $('cb-k61').checked=sc.calcCfg.k61; $('cb-k100').checked=sc.calcCfg.k100;
      $('cb-hfdr').checked=sc.calcCfg.hfdr; $('cb-mfdr').checked=sc.calcCfg.mfdr;
      saveCalcCfg();
      applyPresetCfg(sc.presetCfg); savePrCfg();
      // ベースマップ復元
      if(sc.layer!==curLayer){
        if(sc.layer==='gsi'){ map.removeLayer(layerOSM); layerGSI.addTo(map); curLayer='gsi'; $('layer-btn').textContent='🗺 地図に戻す'; }
        else{ map.removeLayer(layerGSI); layerOSM.addTo(map); curLayer='osm'; $('layer-btn').textContent='📷 航空写真'; }
      }
      // マップビュー復元（先に setView、マーカーは skipFit で描画）
      map.setView([sc.mapLat,sc.mapLng],sc.zoom);
      setPoint(L.latLng(sc.markerLat,sc.markerLng),true);
      $('scene-hist-ov').classList.remove('open');
    });
    const del=document.createElement('button'); del.className='list-del'; del.textContent='削除';
    del.addEventListener('click',ev=>{ ev.stopPropagation(); saveScenes(getScenes().filter(x=>x.id!==sc.id)); renderSceneList(); });
    item.append(info,del); list.appendChild(item);
  });
}
$('scene-hist-btn').addEventListener('click',()=>{ renderSceneList(); $('scene-hist-ov').classList.add('open'); });
$('scene-hist-close').addEventListener('click',()=>$('scene-hist-ov').classList.remove('open'));
$('scene-hist-ov').addEventListener('click',e=>{ if(e.target===$('scene-hist-ov')) $('scene-hist-ov').classList.remove('open'); });

// ── エリア設定 ───────────────────────────────
$('area-btn').addEventListener('click',()=>$('area-ov').classList.add('open'));
$('area-close').addEventListener('click',()=>$('area-ov').classList.remove('open'));
$('area-ov').addEventListener('click',e=>{ if(e.target===$('area-ov')) $('area-ov').classList.remove('open'); });
$('area-save').addEventListener('click',()=>{
  const p=PREFS[Number($('area-sel').value)];
  home={lat:p.lat,lng:p.lng,name:p.n}; lsS(KEY_HOME,home);
  map.setView([p.lat,p.lng],12);
  $('area-fb').textContent='✓ 「'+p.n+'」を設定しました';
  setTimeout(()=>{ $('area-fb').textContent=''; $('area-ov').classList.remove('open'); },1200);
});
</script>
