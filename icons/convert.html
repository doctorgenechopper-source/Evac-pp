<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EOD Tools — 単位変換</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0e6a6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EOD Tools">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{
  --bg:#f1f3f2;--panel:#fff;--ink:#1b2326;--sub:#5a666b;--line:#d3d9d8;
  --acc:#0e6a6a;--acc-ink:#fff;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121719;--panel:#1b2225;--ink:#e6ecea;--sub:#9aa7aa;--line:#2e393c;
  --acc:#4fc1b9;--acc-ink:#06201f;color-scheme:dark;
}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.5}
main{max-width:640px;margin:0 auto;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 72px + 16px)}
h1{font-size:1.2rem;margin:8px 0 14px}

/* タブ */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel);color:var(--sub);font:inherit;font-size:.88rem;cursor:pointer;
  white-space:nowrap}
.tab.active{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* カード */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:14px}
.card h2{font-size:.9rem;color:var(--sub);margin:0 0 12px;font-weight:600}

/* 変換行 */
.urow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.urow:last-child{margin-bottom:0}
.ulabel{font-size:.82rem;color:var(--sub);min-width:130px;flex-shrink:0;line-height:1.3}
.ulabel span{display:block;font-size:.72rem;color:var(--sub);opacity:.7}
.urow input{flex:1;padding:9px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;
  font-size:.95rem;font-variant-numeric:tabular-nums;min-width:0}
.urow input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.urow input.active-in{border-color:var(--acc)}

/* ボトムナビ */
.bnav{position:fixed;bottom:0;left:0;right:0;will-change:transform;transform:translateZ(0);background:var(--panel);
  border-top:1px solid var(--line);display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 4px 6px;text-decoration:none;color:var(--sub);
  font-size:.68rem;gap:3px;border:none;background:none;cursor:pointer}
.bnav-item.active{color:var(--acc)}
.bnav-icon{font-size:1.3rem;line-height:1}

/* クリアボタン */
.clear-btn{margin-top:4px;padding:7px 14px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);
  color:var(--sub);font:inherit;font-size:.85rem;cursor:pointer}
.clear-btn:active{opacity:.7}
</style>
</head>
<body>

<main>
  <h1>EOD Tools — 単位変換</h1>
  <div class="disclaimer">
    ⚠ このツールの計算結果はすべて<strong>参考値</strong>です。実際の作業・避難・安全判断には必ず専門家の指示と公的基準に従ってください。
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="cards"></div>
  <button class="clear-btn" id="clearBtn" type="button">全てクリア</button>
</main>

<!-- ボトムナビ -->
<nav class="bnav" aria-label="メインナビゲーション">
  <a class="bnav-item" href="./index.html">
    <span class="bnav-icon" aria-hidden="true">🚨</span>
    <span>計算</span>
  </a>
  <a class="bnav-item" href="./sandbag.html">
    <span class="bnav-icon" aria-hidden="true">🪏</span>
    <span>土嚢</span>
  </a>
  <a class="bnav-item active" href="./convert.html" aria-current="page">
    <span class="bnav-icon" aria-hidden="true">🔄</span>
    <span>変換</span>
  </a>
  <a class="bnav-item" href="./map.html"><span class="bnav-icon">🗺</span><span>地図</span></a>
</nav>

<script>
// ── 変換カテゴリ定義 ──────────────────────────
// factor: 基準単位(SI)への換算値
const CATS = [
  {
    id:'length', label:'長さ',
    units:[
      {label:'inch',    sub:'インチ',     factor:0.0254},
      {label:'ft',      sub:'フィート',   factor:0.3048},
      {label:'yard',    sub:'ヤード',     factor:0.9144},
      {label:'mm',      sub:'ミリメートル',factor:0.001},
      {label:'cm',      sub:'センチメートル',factor:0.01},
      {label:'m',       sub:'メートル',   factor:1},
    ]
  },
  {
    id:'weight', label:'重さ',
    units:[
      {label:'grain',   sub:'グレーン(火薬)',factor:0.00006479891},
      {label:'oz',      sub:'オンス',     factor:0.028349523},
      {label:'lb',      sub:'ポンド',     factor:0.45359237},
      {label:'g',       sub:'グラム',     factor:0.001},
      {label:'kg',      sub:'キログラム', factor:1},
    ]
  },
  {
    id:'velocity', label:'速度',
    units:[
      {label:'ft/s',    sub:'フィート毎秒',factor:0.3048},
      {label:'m/s',     sub:'メートル毎秒',factor:1},
      {label:'km/h',    sub:'キロ毎時',   factor:0.27778},
    ]
  },
  {
    id:'energy', label:'エネルギー',
    units:[
      {label:'ft·lb',   sub:'フートポンド(破片危険閾値=58)',factor:1.355818},
      {label:'J',       sub:'ジュール',   factor:1},
      {label:'kJ',      sub:'キロジュール',factor:1000},
    ]
  },
  {
    id:'pressure', label:'圧力',
    units:[
      {label:'psi',     sub:'重量ポンド毎平方インチ',factor:6894.76},
      {label:'kPa',     sub:'キロパスカル',factor:1000},
      {label:'MPa',     sub:'メガパスカル',factor:1000000},
      {label:'atm',     sub:'気圧',       factor:101325},
    ]
  },
  {
    id:'area', label:'面積',
    units:[
      {label:'in²',     sub:'平方インチ', factor:0.00064516},
      {label:'ft²',     sub:'平方フィート',factor:0.092903},
      {label:'cm²',     sub:'平方センチ', factor:0.0001},
      {label:'m²',      sub:'平方メートル',factor:1},
    ]
  },
];

let activeCat = 0;
let inputRefs = [];
let cvState = { cat: 0, vals: {} };

const CV_KEY = 'eod-convert-v1';
function cvSave(srcRef){
  try{
    const idx = inputRefs.indexOf(srcRef);
    if(idx < 0) return;
    if(!cvState.vals) cvState.vals = {};
    cvState.vals[CATS[activeCat].id] = { idx, value: srcRef.input.value };
    cvState.cat = activeCat;
    localStorage.setItem(CV_KEY, JSON.stringify(cvState));
  }catch(e){}
}
function cvLoad(){
  try{
    const s = JSON.parse(localStorage.getItem(CV_KEY)||'null');
    if(s) cvState = s;
  }catch(e){}
}

// ── タブ生成 ────────────────────────────────
const tabsEl  = document.getElementById('tabs');
const cardsEl = document.getElementById('cards');

CATS.forEach((cat, i) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tab' + (i === 0 ? ' active' : '');
  btn.textContent = cat.label;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  btn.addEventListener('click', () => selectCat(i));
  tabsEl.appendChild(btn);
});

// ── カード生成 ──────────────────────────────
function buildCards() {
  cardsEl.replaceChildren();
  inputRefs = [];
  const cat = CATS[activeCat];
  const card = document.createElement('div');
  card.className = 'card';
  const h2 = document.createElement('h2');
  h2.textContent = cat.label;
  card.appendChild(h2);

  cat.units.forEach(unit => {
    const row = document.createElement('div');
    row.className = 'urow';

    const lbl = document.createElement('label');
    lbl.className = 'ulabel';
    lbl.innerHTML = unit.label + (unit.sub ? `<span>${unit.sub}</span>` : '');

    const inp = document.createElement('input');
    inp.type = 'number';
    inp.inputMode = 'decimal';
    inp.step = 'any';
    inp.placeholder = '0';
    inp.setAttribute('aria-label', unit.label);

    const ref = { input: inp, factor: unit.factor };
    inputRefs.push(ref);

    inp.addEventListener('focus', () => {
      inputRefs.forEach(r => r.input.classList.remove('active-in'));
      inp.classList.add('active-in');
    });
    inp.addEventListener('input', () => onInput(ref));

    lbl.appendChild(inp); // label wraps input for tap area
    // Actually, separate label and input for better layout
    const lbl2 = document.createElement('span');
    lbl2.className = 'ulabel';
    lbl2.innerHTML = unit.label + (unit.sub ? `<span>${unit.sub}</span>` : '');

    row.append(lbl2, inp);
    card.appendChild(row);
  });

  cardsEl.appendChild(card);

  // 保存値を復元
  const saved = cvState.vals && cvState.vals[cat.id];
  if(saved && inputRefs[saved.idx] && saved.value !== ''){
    inputRefs[saved.idx].input.value = saved.value;
    onInput(inputRefs[saved.idx]);
  }
}

// ── 変換ロジック ────────────────────────────
function onInput(srcRef) {
  const v = parseFloat(srcRef.input.value);
  if (isNaN(v) || srcRef.input.value.trim() === '') {
    inputRefs.forEach(r => { if (r !== srcRef) r.input.value = ''; });
    return;
  }
  const baseVal = v * srcRef.factor;
  inputRefs.forEach(r => {
    if (r === srcRef) return;
    const converted = baseVal / r.factor;
    r.input.value = +converted.toPrecision(6);
  });
  cvSave(srcRef);
}

// ── タブ切り替え ────────────────────────────
function selectCat(i) {
  activeCat = i;
  tabsEl.querySelectorAll('.tab').forEach((btn, j) => {
    btn.classList.toggle('active', j === i);
    btn.setAttribute('aria-selected', j === i ? 'true' : 'false');
  });
  buildCards();
}

// ── クリア ───────────────────────────────────
document.getElementById('clearBtn').addEventListener('click', () => {
  inputRefs.forEach(r => { r.input.value = ''; r.input.classList.remove('active-in'); });
  if(cvState.vals) cvState.vals[CATS[activeCat].id] = null;
  try{ localStorage.setItem(CV_KEY, JSON.stringify(cvState)); }catch(e){}
});

// ── 初期描画（保存データを復元） ─────────────
cvLoad();
selectCat(cvState.cat || 0);
</script>
</body>
</html>
